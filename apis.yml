        url: https://www.typescriptlang.org/tsconfig
      - type: Compiler Options
        url: https://www.typescriptlang.org/tsconfig/

  - aid: typescript:typescript-language-service-api
    name: TypeScript Language Service API
    description: >-
      API for editor integration and language tooling. The Language Service API
      provides completions, diagnostics, quick fixes, rename, go-to-definition,
      find references, and other IDE features that power editors like VS Code.
    image: https://www.typescriptlang.org/favicon-32x32.png
    humanURL: https://www.typescriptlang.org
    baseURL: https://www.typescriptlang.org
    tags:
      - Autocomplete
      - Diagnostics
      - IDE
      - Language Service
      - Refactoring
    properties:
      - type: Documentation
        url: https://github.com/microsoft/TypeScript/wiki/Using-the-Language-Service-API
      - type: GitHubRepository
        url: https://github.com/microsoft/TypeScript

  - aid: typescript:typescript-transform-api
    name: TypeScript Transform API
    description: >-
      The TypeScript Transform API enables custom AST transformations during
      compilation. Transformers can modify, add, or remove nodes in the
      TypeScript AST before code emission.
    image: https://www.typescriptlang.org/favicon-32x32.png
    humanURL: https://www.typescriptlang.org/docs/handbook/2/types-from-types.html
    baseURL: https://www.typescriptlang.org
    tags:
      - AST
      - Code Transformation
      - Compilation
      - Custom Transformers
    properties:
