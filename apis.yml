aid: typescript
name: TypeScript
description: >-
  TypeScript is a strongly typed programming language that builds on JavaScript,
  adding optional static type checking and other features. Developed and maintained
  by Microsoft, TypeScript compiles to plain JavaScript and is widely used for
  large-scale web applications, Node.js services, and developer tooling. The
  TypeScript Compiler API and Language Service API enable programmatic compilation,
  type checking, code transformation, and IDE integrations.
